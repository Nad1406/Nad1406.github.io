<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171722" />
      <stop offset="55%" stop-color="#0D0D14" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.18" cy="0.18" r="0.65">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="roseGlow" cx="0.82" cy="0.84" r="0.65">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassSheen" x1="64" y1="32" x2="360" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0.48" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="364" y1="324" x2="424" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8CB4" />
      <stop offset="100%" stop-color="#FF548E" />
    </linearGradient>
  </defs>

  <!-- Obsidian Rounded Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)" />
  <!-- Ambient Teal & Rose Orbs -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#tealGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#roseGlow)" />
  <!-- Frosted Top Glass Sheen -->
  <path d="M136 24H376C437.856 24 488 74.144 488 136V208C392 254 218 262 24 196V136C24 74.144 74.144 24 136 24Z" fill="url(#glassSheen)" />
  <!-- Glassmorphic Rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Bold Geometric Letter D -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M128 132H228C303.111 132 360 185.629 360 256C360 326.371 303.111 380 228 380H128V132ZM186 184V328H225C268.2 328 300 298.1 300 256C300 213.9 268.2 184 225 184H186Z"
    fill="#F8FAFC"
  />

  <!-- Signature Rose-Pink Accent Dot -->
  <circle cx="394" cy="354" r="30" fill="url(#dotGrad)" />
